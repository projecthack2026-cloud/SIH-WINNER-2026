<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset='UTF-8'>
    <title>MPLADS AI Auditor</title>
    <!-- Leaflet & Chart.js -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <style>
        /* Global Reset & Layout */
        html, body { 
            margin: 0; padding: 0; height: 100vh; 
            font-family: system-ui, -apple-system, sans-serif; 
            background: #f8fafc; box-sizing: border-box;
            display: flex; /* Sidebar layout */
            overflow: hidden;
        }
        *, *:before, *:after { box-sizing: inherit; }

        /* Sidebar Styling */
        .sidebar {
            width: 260px;
            background: #0f172a;
            color: white;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            box-shadow: 2px 0 5px rgba(0,0,0,0.1);
            z-index: 1000;
            transition: margin-left 0.3s ease; /* Smooth sliding animation */
        }
        
        /* Class to hide the sidebar */
        .sidebar.hidden {
            margin-left: -260px;
        }

        .brand { padding: 20px; font-size: 1.2rem; font-weight: 700; border-bottom: 1px solid #1e293b; color: #f8fafc;}
        .brand span { color: #3b82f6; }

        .nav-menu { flex-grow: 1; padding: 20px 0; display: flex; flex-direction: column; gap: 5px; }
        .nav-link {
            padding: 12px 20px; color: #94a3b8; text-decoration: none;
            display: flex; align-items: center; gap: 10px; font-weight: 500;
            transition: all 0.2s; border-left: 3px solid transparent;
        }
        .nav-link:hover { background: #1e293b; color: white; }
        .nav-link.active { background: #1e293b; color: #3b82f6; border-left-color: #3b82f6; }

        /* Main Content Area */
        .main-content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: width 0.3s ease;
        }

        .top-header {
            height: 60px; background: white; border-bottom: 1px solid #e2e8f0;
            display: flex; align-items: center; padding: 0 20px; flex-shrink: 0;
            font-weight: 600; color: #334155; gap: 15px;
        }

        /* Hamburger Button */
        .hamburger-btn {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: #475569;
            padding: 4px 8px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }
        .hamburger-btn:hover {
            background: #f1f5f9;
        }
    </style>
    {% block head %}{% endblock %}
</head>
<body>
    
    <!-- Sidebar Navigation -->
    <div class="sidebar hidden" id="sidebar">
        <div class="brand">MPLADS <span>Auditor</span></div>
        <div class="nav-menu">
            <a href="/" class="nav-link {{ 'active' if request.path == '/' else '' }}">
                📊 Command Center
            </a>
            <a href="/investigate" class="nav-link {{ 'active' if request.path == '/investigate' else '' }}">
                🤖 Investigation Engine
            </a>
        </div>
        <div style="padding: 20px; color: #64748b; font-size: 0.8rem;">
            MVP Build v1.0
        </div>
    </div>

    <!-- Right Side Content -->
    <div class="main-content">
        <div class="top-header">
            <!-- The Hamburger Menu Icon -->
            <button id="sidebar-toggle" class="hamburger-btn" aria-label="Toggle Sidebar">☰</button>
            {% block header_title %}Dashboard{% endblock %}
        </div>
        {% block content %}{% endblock %}
    </div>

    <!-- Sidebar Toggle Logic -->
    <script>
        document.getElementById('sidebar-toggle').addEventListener('click', function() {
            const sidebar = document.getElementById('sidebar');
            sidebar.classList.toggle('hidden');
            
            // Wait for the CSS sliding animation to finish (300ms), 
            // then force a window resize event so Leaflet maps and Chart.js 
            // correctly expand to fill the new extra space.
            setTimeout(() => {
                window.dispatchEvent(new Event('resize'));
            }, 300); 
        });
    </script>

    {% block scripts %}{% endblock %}
</body>
</html>
