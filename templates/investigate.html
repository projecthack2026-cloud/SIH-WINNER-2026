{% extends 'base.html' %}

{% block header_title %}Investigation Engine{% endblock %}

{% block head %}
<style>
    .investigate-layout { padding: 30px; display: flex; flex-direction: column; height: calc(100vh - 60px); }
    
    .input-section { display: flex; gap: 15px; margin-bottom: 20px; }
    .input-section input { flex-grow: 1; padding: 12px 15px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 1rem; }
    .input-section button { padding: 12px 24px; background: #2563eb; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; }
    
    .agent-console {
        flex-grow: 1; background: white; border: 1px solid #e2e8f0; border-radius: 8px;
        padding: 25px; overflow-y: auto; font-family: monospace; font-size: 0.95rem; line-height: 1.6;
    }
    
    .log-step { margin-bottom: 15px; display: flex; gap: 15px; }
    .log-action { background: #f1f5f9; color: #334155; padding: 4px 10px; border-radius: 4px; font-weight: 600; white-space: nowrap; height: fit-content; }
    .log-result { color: #475569; }
    
    .finding-box { margin-top: 30px; padding: 20px; background: #fef2f2; border: 1px solid #fecaca; border-left: 5px solid #ef4444; border-radius: 6px; }
    .finding-box h3 { color: #991b1b; margin-top: 0; font-family: system-ui, sans-serif;}
</style>
{% endblock %}

{% block content %}
<div class="investigate-layout">
    
    <!-- Target Input -->
    <div class="input-section">
        <input type="text" id="target-input" placeholder="Enter Constituency or Region to investigate (e.g., Pune)..." value="{{ target_region }}">
        <button onclick="startInvestigation()">Run Audit AI</button>
    </div>

    <!-- AI Output Terminal -->
    <div class="agent-console" id="agent-output">
        <div style="color: #94a3b8;">System ready. Waiting for target input...</div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    async function startInvestigation() {
        const targetId = document.getElementById('target-input').value.trim();
        if (!targetId) return;

        const agentOutput = document.getElementById('agent-output');
        agentOutput.innerHTML = `
            <div style="color: #dc2626; font-weight: bold; margin-bottom: 20px;">> Initializing audit sequence for: ${targetId}</div>
            <div class="log-step">
                <div class="log-action">SYSTEM</div>
                <div class="log-result">Connecting to LLM Orchestrator...</div>
            </div>
        `;

        try {
            const response = await fetch('/api/investigate', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ target_id: targetId })
            });
            const data = await response.json();
            
            // Build the execution log
            let stepsHTML = data.steps.map(step => `
                <div class="log-step">
                    <div class="log-action">CALL: ${step.action}</div>
                    <div class="log-result">${step.result}</div>
                </div>
            `).join('');

            agentOutput.innerHTML += stepsHTML;

            // Add the final finding
            agentOutput.innerHTML += `
                <div class="finding-box">
                    <h3>Final Audit Recommendation</h3>
                    <p style="font-family: system-ui, sans-serif; font-size: 1.1rem; color: #7f1d1d; margin: 0;">
                        ${data.final_finding}
                    </p>
                </div>
            `;
            
            // Scroll to bottom
            agentOutput.scrollTop = agentOutput.scrollHeight;
            
        } catch (error) {
            agentOutput.innerHTML += `<div style="color: red; margin-top: 20px;">Error: Connection failed.</div>`;
        }
    }

    // Auto-start if a target was passed in the URL (e.g., from the map click)
    window.onload = () => {
        if(document.getElementById('target-input').value !== '') {
            startInvestigation();
        }
    };
</script>
{% endblock %}
